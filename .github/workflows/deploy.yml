name: Deploy

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Published GitHub Release tag to deploy (e.g. v1.0.0)
        type: string
        required: true
      force_recreate:
        description: Recreate every application container (needed after rotating JWT_PRIVATE_KEY or TOKEN_SERVICE_KEY without a code change)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  release:
    name: Resolve release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
      manifest_artifact: deploy-image-manifest-${{ github.run_attempt }}
    steps:
      - name: Require main workflow branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from the main branch"
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release and resolve commit
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: bash deploy/resolve-release.sh

      - name: Download and validate image manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          if ! gh release download "$RELEASE_VERSION" --pattern image-manifest.json --dir "$RUNNER_TEMP"; then
            echo "::error::No image manifest found; run Build release successfully for this release first"
            exit 1
          fi
          bash deploy/image-manifest.sh "$RUNNER_TEMP/image-manifest.json"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published images are available
        run: |
          for service in accountmanager authoriser logkeymanager logservice nginx tokenhandler; do
            digest=$(jq -r --arg service "$service" '.images[$service]' "$RUNNER_TEMP/image-manifest.json")
            docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY,,}/$service@$digest" >/dev/null
          done
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-image-manifest-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-manifest.json
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to OCI
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DOMAIN: ${{ vars.DOMAIN }}
      OCI_SSH_NSG_ID: ${{ vars.OCI_SSH_NSG_ID }}
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
      RELEASE_COMMIT: ${{ needs.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.commit }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.release.outputs.manifest_artifact }}
          path: ${{ runner.temp }}

      - name: Check configuration
        env:
          DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
          OCI_REGION: ${{ vars.OCI_REGION }}
        run: |
          missing=0
          for name in DEPLOY_HOST DOMAIN OCI_SSH_NSG_ID DEPLOY_SSH_KNOWN_HOSTS OCI_REGION; do
            if [[ -z ${!name} ]]; then
              echo "::error::Variable $name is not set on the production environment"
              missing=1
            fi
          done
          [[ $DEPLOY_HOST =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || { echo "::error::DEPLOY_HOST must be an IPv4 address"; missing=1; }
          exit $missing

      - name: Build release bundle
        env:
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          JWT_ISSUER: ${{ vars.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ vars.JWT_AUDIENCE }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          TOKEN_SERVICE_KEY: ${{ secrets.TOKEN_SERVICE_KEY }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          TLS_CERTIFICATE: ${{ secrets.TLS_CERTIFICATE }}
          TLS_PRIVATE_KEY: ${{ secrets.TLS_PRIVATE_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RECREATE: ${{ inputs.force_recreate && 'true' || 'false' }}
          IMAGE_MANIFEST: ${{ runner.temp }}/image-manifest.json
        run: deploy/build-bundle.sh "$RUNNER_TEMP/bundle"

      - name: Install OCI CLI
        run: pipx install oci-cli

      - name: Configure OCI CLI
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ vars.OCI_REGION }}
        run: |
          umask 077
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_PRIVATE_KEY" >~/.oci/oci_api_key.pem
          cat >~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_USER_OCID}
          fingerprint=${OCI_FINGERPRINT}
          tenancy=${OCI_TENANCY_OCID}
          region=${OCI_REGION}
          key_file=${HOME}/.oci/oci_api_key.pem
          EOF

      - name: Open SSH from this runner
        run: deploy/ssh-access.sh open

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" >~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" >~/.ssh/known_hosts
          cat >~/.ssh/config <<EOF
          Host deploy-target
            HostName ${DEPLOY_HOST}
            User deploy
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ConnectTimeout 10
            ServerAliveInterval 15
            ServerAliveCountMax 8
          EOF

      - name: Wait for SSH
        run: |
          # NSG rule propagation and a freshly booted host can each take a minute.
          for attempt in $(seq 1 30); do
            if ssh -o BatchMode=yes deploy-target true 2>/dev/null; then
              echo "SSH is reachable."
              exit 0
            fi
            echo "SSH not reachable yet (attempt $attempt/30)"
            sleep 10
          done
          echo "::error::Could not reach $DEPLOY_HOST over SSH"
          ssh -o BatchMode=yes -v deploy-target true || true
          exit 1

      - name: Upload bundle and deploy
        run: |
          tar -C "$RUNNER_TEMP/bundle" -czf - . |
            ssh -o BatchMode=yes deploy-target \
              'umask 077 && rm -rf /opt/logging-service/incoming && mkdir -p /opt/logging-service/incoming && tar -xzf - -C /opt/logging-service/incoming'
          rm -rf "$RUNNER_TEMP/bundle"
          ssh -o BatchMode=yes deploy-target 'bash /opt/logging-service/incoming/app/deploy/remote-deploy.sh'

      - name: Smoke test
        run: |
          for path in /health /ping; do
            for _ in $(seq 1 10); do
              if curl -fsS --max-time 10 --resolve "$DOMAIN:443:$DEPLOY_HOST" "https://$DOMAIN$path" -o /dev/null; then
                echo "https://$DOMAIN$path OK"
                continue 2
              fi
              sleep 6
            done
            echo "::error::https://$DOMAIN$path did not respond successfully"
            exit 1
          done
          for _ in $(seq 1 10); do
            if curl -fsS --max-time 10 --resolve "$DOMAIN:443:$DEPLOY_HOST" "https://$DOMAIN/version" |
              jq -e --arg version "$RELEASE_VERSION" --arg commit "$RELEASE_COMMIT" \
                '.version == $version and .commit == $commit' >/dev/null; then
              echo "https://$DOMAIN/version matches $RELEASE_VERSION ($RELEASE_COMMIT)"
              exit 0
            fi
            sleep 6
          done
          echo "::error::https://$DOMAIN/version did not match the selected release"
          exit 1

      - name: Close SSH and remove credentials
        if: always()
        run: |
          if [[ -f ~/.oci/config ]]; then
            deploy/ssh-access.sh close || echo "::warning::Failed to remove transient SSH rule; it will be removed by the next deploy"
          fi
          rm -rf ~/.ssh/deploy_key ~/.oci "$RUNNER_TEMP/bundle"
