services:
  authoriser:
    build:
      context: .
      dockerfile: Dockerfile.authoriser
    environment:
      POSTGRES_URL: "${POSTGRES_URL}"
      AUTHORISER_API_PORT: "${AUTHORISER_API_PORT}"
    networks:
      - backend
  logkeymanager:
    build:
      context: .
      dockerfile: Dockerfile.logkeymanager
    environment:
      POSTGRES_URL: "${POSTGRES_URL}"
      LOGKEYMANAGER_API_PORT: "${LOGKEYMANAGER_API_PORT}"
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ISSUER: "${JWT_ISSUER:-logging-service}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-account-management}"
    secrets:
      - jwt_public_key
    networks:
      - edge
      - backend
  logservice:
    build:
      context: .
      dockerfile: Dockerfile.logservice
    environment:
      POSTGRES_URL: "${POSTGRES_URL}"
      LOGSERVICE_API_PORT: "${LOGSERVICE_API_PORT}"
      LOGSERVICE_ENV: "${LOGSERVICE_ENV:-}"
      LOGSERVICE_AUTH_MODE: "${LOGSERVICE_AUTH_MODE:-authoriser}"
      AUTHORISER_URL: "${AUTHORISER_URL:-http://authoriser:${AUTHORISER_API_PORT}}"
    networks:
      - edge
      - backend
  accountmanager:
    build:
      context: .
      dockerfile: Dockerfile.accountmanager
    environment:
      POSTGRES_URL: "${POSTGRES_URL}"
      ACCOUNTMANAGER_API_PORT: "${ACCOUNTMANAGER_API_PORT}"
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ISSUER: "${JWT_ISSUER:-logging-service}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-account-management}"
      TOKENHANDLER_URL: "http://tokenhandler:${TOKENHANDLER_API_PORT:-8084}"
      TOKEN_SERVICE_KEY: "${TOKEN_SERVICE_KEY:?Set TOKEN_SERVICE_KEY}"
    secrets:
      - jwt_public_key
    networks:
      - edge
      - backend
  tokenhandler:
    build:
      context: .
      dockerfile: Dockerfile.tokenhandler
    environment:
      POSTGRES_URL: "${POSTGRES_URL}"
      TOKENHANDLER_API_PORT: "${TOKENHANDLER_API_PORT:-8084}"
      TOKEN_SERVICE_KEY: "${TOKEN_SERVICE_KEY:?Set TOKEN_SERVICE_KEY}"
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      JWT_ISSUER: "${JWT_ISSUER:-logging-service}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-account-management}"
    secrets:
      - jwt_private_key
    networks:
      - backend
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      ACCOUNTMANAGER_API_PORT: "${ACCOUNTMANAGER_API_PORT}"
      LOGKEYMANAGER_API_PORT: "${LOGKEYMANAGER_API_PORT}"
      LOGSERVICE_API_PORT: "${LOGSERVICE_API_PORT}"
      NGINX_SERVER_NAME: "${NGINX_SERVER_NAME:?Set NGINX_SERVER_NAME}"
      RELEASE_VERSION: "${RELEASE_VERSION:-development}"
      RELEASE_COMMIT: "${RELEASE_COMMIT:-development}"
      NGINX_ENVSUBST_FILTER: "^(ACCOUNTMANAGER_API_PORT|LOGKEYMANAGER_API_PORT|LOGSERVICE_API_PORT|NGINX_SERVER_NAME|RELEASE_VERSION|RELEASE_COMMIT)$"
    secrets:
      - nginx_tls_certificate
      - nginx_tls_private_key
    networks:
      - edge
    depends_on:
      - accountmanager
      - logkeymanager
      - logservice
  postgres:
    image: "postgres:alpine"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
  postgres_migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=${POSTGRES_MIGRATION_URL:?Set POSTGRES_MIGRATION_URL}
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

secrets:
  jwt_private_key:
    file: "${JWT_PRIVATE_KEY_FILE:?Set JWT_PRIVATE_KEY_FILE to an external Ed25519 PEM file}"
  jwt_public_key:
    file: "${JWT_PUBLIC_KEY_FILE:?Set JWT_PUBLIC_KEY_FILE to an external public PEM file}"
  nginx_tls_certificate:
    file: "${NGINX_TLS_CERT_FILE:?Set NGINX_TLS_CERT_FILE to an external certificate PEM file}"
  nginx_tls_private_key:
    file: "${NGINX_TLS_KEY_FILE:?Set NGINX_TLS_KEY_FILE to an external private key PEM file}"

networks:
  edge:
  backend:
    internal: true